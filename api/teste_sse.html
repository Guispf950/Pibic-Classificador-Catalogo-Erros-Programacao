<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Teste do streaming (SSE) — /v1/feedbacks</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; }
    textarea { width: 100%; height: 140px; font-family: Consolas, monospace; }
    #saida { white-space: pre-wrap; background: #f4f6f8; border: 1px solid #ccc; padding: 12px; min-height: 120px; margin-top: 12px; }
    button { padding: 8px 16px; margin-top: 8px; }
    .diag { color: #1F4E79; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Teste do /v1/feedbacks (SSE)</h2>
  <p>Cole um código e (se o programa ler algo) a <b>entrada</b> do caso de teste. O feedback deve aparecer <b>token a token</b>.</p>

  <label for="codigo"><b>Código C</b></label>
  <textarea id="codigo">int main(){ int *p = 0; return *p; }</textarea>

  <label for="entrada"><b>Entrada (stdin)</b> — deixe vazio se o programa não lê nada</label>
  <textarea id="entrada" style="height:70px" placeholder="ex.: 5&#10;1 2 3 4 5"></textarea>

  <br />
  <button onclick="analisar()">Analisar (diagnóstico rápido)</button>
  <button onclick="enviar()">Feedback (streaming)</button>
  <div id="saida"></div>

  <script>
    // Colando código nas textareas, as quebras de linha vão de verdade — o
    // JSON.stringify escapa tudo sozinho. Não precisa pôr \n na mão.

    // POST /v1/diagnostics: diagnóstico determinístico (JSON), sem streaming.
    async function analisar() {
      const saida = document.getElementById("saida");
      saida.textContent = "Analisando...";
      const codigo = document.getElementById("codigo").value;
      const entrada = document.getElementById("entrada").value;
      const resp = await fetch("/v1/diagnostics", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ codigo: codigo, entrada: entrada, nome_arquivo: "submissao.c" }),
      });
      const dados = await resp.json();
      saida.textContent = JSON.stringify(dados, null, 2);  // mostra o diagnóstico formatado
    }
    // Por que fetch() e não EventSource?
    //   O EventSource nativo do navegador só faz requisições GET. Como o nosso
    //   /v1/feedbacks é um POST (envia o código no corpo), lemos o stream "na mão"
    //   com fetch() + ReadableStream, e separamos os eventos SSE (linhas "data: ...").
    async function enviar() {
      const saida = document.getElementById("saida");
      saida.textContent = "";
      const codigo = document.getElementById("codigo").value;
      const entrada = document.getElementById("entrada").value;  // stdin do caso de teste

      // URL relativa: resolve contra a origem da página, então funciona por localhost
      // ou pelo IP da máquina na rede (ao acessar /teste de outro dispositivo).
      const resp = await fetch("/v1/feedbacks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ codigo: codigo, entrada: entrada, nome_arquivo: "submissao.c" }),
      });

      // response.body é um "stream" de bytes. Lemos em pedaços conforme chegam.
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;                       // servidor fechou o stream (evento 'fim')
        buffer += decoder.decode(value, { stream: true });

        // Eventos SSE são separados por uma LINHA EM BRANCO (\n\n).
        let partes = buffer.split("\n\n");
        buffer = partes.pop();                 // guarda o pedaço incompleto para a próxima volta
        for (const bloco of partes) {
          const linha = bloco.trim();
          if (!linha.startsWith("data:")) continue;
          const obj = JSON.parse(linha.slice(5).trim());   // remove "data:" e faz parse do JSON

          if (obj.tipo === "status") {
            saida.textContent += "[" + obj.msg + "]\n";
          } else if (obj.tipo === "diagnostico") {
            const d = obj.dados;
            saida.innerHTML += '<span class="diag">Diagnostico: ' +
              d.tipo_erro + " (" + d.cwe_id + ") linha " + d.linha_sintoma + "</span>\n";
          } else if (obj.tipo === "token") {
            saida.textContent += obj.texto;     // vai "digitando" o feedback
          } else if (obj.tipo === "fim") {
            saida.textContent += "\n[fim]";
          }
        }
      }
    }
  </script>
</body>
</html>
